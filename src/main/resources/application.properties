# Основные настройки приложения
spring.application.name=cinema
spring.main.banner-mode=off

# Подавление стандартных служебных сообщений для чистоты консольного вывода
logging.level.root=WARN

# Включение информативного логирования для модуля многопоточной обработки заявок
logging.level.com.cinema.concurrent=INFO

# Кастомный формат вывода логов в консоль: время, имя потока, сообщение
logging.pattern.console=%d{HH:mm:ss.SSS} [%-9thread] %msg%n

# Имя приложения и порт сервера.
spring.application.name=cinema
server.port=8080

# Настройки подключения к PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Проверка соответствия JPA-сущностей существующей схеме БД без её автоматического изменения.
spring.jpa.hibernate.ddl-auto=validate

# Уровень логирования для пакетов проекта. INFO выводит только основную информацию о старте и ошибках, без отладочного шума.
logging.level.com.cinema=INFO